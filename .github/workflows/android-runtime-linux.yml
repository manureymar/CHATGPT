name: Android Runtime Diagnostics Linux

on:
  pull_request:
    branches: [ main ]

jobs:
  runtime-smoke-test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Build APK
        run: gradle --no-daemon clean assembleDebug
      - name: Boot emulator, install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.manureymar.ridgerush
            adb shell monkey -p com.manureymar.ridgerush -c android.intent.category.LAUNCHER 1
            sleep 6
            echo '=== PID ==='
            adb shell pidof com.manureymar.ridgerush
            echo '=== ANDROIDRUNTIME ==='
            adb logcat -d -v threadtime | grep -E 'AndroidRuntime|FATAL EXCEPTION|Process: com.manureymar.ridgerush|Caused by:|MainActivity|GameView' | tail -n 300 || true

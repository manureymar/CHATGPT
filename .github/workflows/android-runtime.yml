name: Android Runtime Diagnostics

on:
  pull_request:
    branches: [ main ]

jobs:
  runtime-smoke-test:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle --no-daemon clean assembleDebug
      - name: Boot emulator and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.manureymar.ridgerush
            adb shell am start -W -n com.manureymar.ridgerush/com.openai.ridgerush.MainActivity
            sleep 5
            echo '=== PID ==='
            adb shell pidof com.manureymar.ridgerush || true
            echo '=== CRASH / FATAL LOGS ==='
            adb logcat -d -v threadtime '*:S' AndroidRuntime:E ActivityManager:I ActivityTaskManager:I DEBUG:E libc:F | tail -n 400
            echo '=== PACKAGE INFO ==='
            adb shell dumpsys package com.manureymar.ridgerush | head -n 160
            if ! adb shell pidof com.manureymar.ridgerush >/dev/null; then
              echo 'APP_CRASHED_OR_DID_NOT_START'
              exit 1
            fi

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.openai.ridgerush'
    compileSdk 36

    defaultConfig {
        applicationId 'com.manureymar.ridgerush'
        minSdk 23
        targetSdk 36
        versionCode 5
        versionName '2.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}
